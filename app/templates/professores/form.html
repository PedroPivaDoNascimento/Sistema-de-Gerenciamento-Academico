{% extends 'base.html' %}

{% block title %}{% if professor %}Editar Professor{% else %}Cadastrar Professor{% endif %} - Gestão Acadêmica{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white border-0 pt-4 px-4">
                <h3 class="fw-bold">
                    <i class="fa-solid {% if professor %}fa-pen{% else %}fa-plus{% endif %} text-success me-2"></i>
                    {% if professor %}Editar Professor{% else %}Cadastrar Professor{% endif %}
                </h3>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome Completo</label>
                        <input type="text" class="form-control" id="nome" name="nome" value="{{ professor.nome if professor else '' }}" required placeholder="Ex: Dr. Carlos Eduardo">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ professor.email if professor else '' }}" required placeholder="Ex: carlos.eduardo@universidade.edu">
                    </div>

                    <div class="mb-3">
                        <label for="departamento" class="form-label">Departamento</label>
                        <input type="text" class="form-control" id="departamento" name="departamento" value="{{ professor.departamento if professor else '' }}" required placeholder="Ex: Ciência da Computação">
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{{ url_for('professores.index') }}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success">
                            <i class="fa-solid fa-save me-1"></i> Salvar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
