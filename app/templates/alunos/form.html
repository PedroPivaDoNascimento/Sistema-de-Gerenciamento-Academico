{% extends 'base.html' %}

{% block title %}{% if aluno %}Editar Aluno{% else %}Cadastrar Aluno{% endif %} - Gestão Acadêmica{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white border-0 pt-4 px-4">
                <h3 class="fw-bold">
                    <i class="fa-solid {% if aluno %}fa-user-pen{% else %}fa-user-plus{% endif %} text-primary me-2"></i>
                    {% if aluno %}Editar Aluno{% else %}Cadastrar Aluno{% endif %}
                </h3>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome Completo</label>
                        <input type="text" class="form-control" id="nome" name="nome" value="{{ aluno.nome if aluno else '' }}" required placeholder="Ex: João Silva">
                    </div>

                    <div class="mb-3">
                        <label for="matricula" class="form-label">Matrícula</label>
                        <input type="text" class="form-control" id="matricula" name="matricula" value="{{ aluno.matricula if aluno else '' }}" required placeholder="Ex: 2026001">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ aluno.email if aluno else '' }}" required placeholder="Ex: joao.silva@exemplo.com">
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{{ url_for('alunos.index') }}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fa-solid fa-save me-1"></i> Salvar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
